<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ludo</title>
    <link rel="stylesheet" href="styles/main.css" />
    <script src="https://unpkg.com/vue@3.5.34/dist/vue.global.js"></script>
    <script type="module" src="main.js" defer></script>
  </head>
  <body>
    <main id="app">
      <div id="board">
        <!-- 4 BASES -->
        <div v-for="color in colors" :class="['base', color]">
          <div class="base-inner"></div>
        </div>

        <!-- 4 GALLERIES -->
        <div
          v-for="color in colors"
          :class="['gallery', color, {vertical: shouldGalleryBeVertical(color)}]"
        >
          <div class="path" v-for="pathN in 3" :key="pathN">
            <div
              :class="['cell', {colored: shouldCellBeColored(color, pathN, cellN)}]"
              v-for="cellN in 6"
              :key="cellN"
            >
              <span class="star" v-if="shouldCellHaveStar(color, pathN, cellN)">☆</span>
              <span class="arrow" v-if="shouldCellHaveArrow(color, pathN, cellN)">▶</span>
            </div>
          </div>
        </div>

        <!-- HOME -->
        <div class="home">
          <img src="assets/center-triangle.svg" class="center-triangle-svg" alt="" />
        </div>

        <!-- 16 TOKENS -->
        <div
          v-for="n in 16"
          :key="n"
          :class="['token', `token-${n}`, getColorForToken(n)]"
        ></div>

        <!-- 16 TOKEN-BASES -->
        <div v-for="n in 16" :key="n" :class="['token-base', `token-base-${n}`]"></div>
      </div>
    </main>
  </body>
</html>
