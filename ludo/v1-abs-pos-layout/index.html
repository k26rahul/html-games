<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ludo</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="stylesheet" href="styles/main.css" />
    <script src="https://unpkg.com/vue@3.5.34/dist/vue.global.js"></script>
    <script type="module" src="scripts/main.js" defer></script>
  </head>
  <body>
    <main id="app">
      <div id="board">
        <!-- 4 BASES -->
        <div v-for="color in colors" :key="color" :class="['base', color]">
          <div class="base-inner"></div>
        </div>

        <!-- 4 GALLERIES -->
        <div
          v-for="gallery in galleries"
          :key="gallery.color"
          :class="['gallery', gallery.color, { vertical: gallery.isVertical }]"
        >
          <div class="path" v-for="(path, pIndex) in gallery.paths" :key="pIndex">
            <div
              v-for="cell in path"
              :key="cell.id"
              :class="['cell', { colored: cell.colored }]"
            >
              <span class="cell-number">{{ cell.number }}</span>
              <span class="star" v-if="cell.hasStar">☆</span>
              <span class="arrow" v-if="cell.hasArrow">▶</span>
            </div>
          </div>
        </div>

        <!-- HOME -->
        <div class="home">
          <img src="assets/center-triangle.svg" class="center-triangle-svg" alt="" />
        </div>

        <!-- 16 TOKENS -->
        <div
          v-for="token in tokens"
          :key="token.id"
          :class="['token', `token-${token.id}`, token.color]"
        ></div>

        <!-- 16 TOKEN-BASES -->
        <div v-for="n in 16" :key="n" :class="['token-base', `token-base-${n}`]"></div>
      </div>
    </main>
  </body>
</html>
